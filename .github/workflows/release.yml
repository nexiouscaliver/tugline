# Release pipeline: PyPI publishing via OpenID Connect Trusted Publishing.
# This requires the PyPI Trusted Publisher registration (owner nexiouscaliver,
# repo tugline, workflow release.yml, environment pypi) done by the operator
# before the first tag is pushed.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build distributions
        run: uv build
      - name: Publish to PyPI
        run: uv publish
